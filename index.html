<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vôlei de Areia - Saque no Alvo Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #111; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    /* Layout Responsivo para Celular */
    #game-container { 
      position: relative; 
      width: 100%; 
      max-width: 800px; 
      height: 90vh; 
      max-height: 600px; 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
      background: #222;
    }

    .screen { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0, 0, 0, 0.92); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 10; 
      padding: 15px; 
      overflow-y: auto;
    }

    .hidden { display: none !important; }
    
    h1 { font-size: 24px; color: #f1c40f; margin-bottom: 10px; text-shadow: 2px 2px #000; text-align: center; }
    h3 { font-size: 16px; margin-bottom: 8px; color: #ddd; }
    
    /* Grid Adaptável de Jogadores */
    .player-select { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
      width: 100%; 
      max-width: 400px; 
      max-height: 320px; 
      overflow-y: auto; 
      padding: 5px;
    }

    .player-card { 
      background: #1e1e1e; 
      border: 2px solid #444; 
      border-radius: 8px; 
      padding: 8px; 
      cursor: pointer; 
      text-align: center; 
      transition: all 0.2s; 
    }

    .player-card:hover, .player-card.selected { border-color: #f1c40f; background: #2a2a2a; }
    
    /* Correção da foto para focar no rosto sem cortar */
    .avatar-wrapper {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto;
      background: #333;
      border: 2px solid #555;
    }

    .player-card img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      object-position: top; 
    }

    .player-card p { margin: 4px 0 2px 0; font-weight: bold; font-size: 13px; color: #f1c40f; }
    
    .stats-list { font-size: 10px; text-align: center; background: rgba(0,0,0,0.5); padding: 3px; border-radius: 4px; color: #bbb; }
    
    .difficulty-select { margin: 10px 0; }
    select, button { padding: 10px 20px; font-size: 15px; border-radius: 6px; border: none; cursor: pointer; }
    button { background: #e67e22; color: white; font-weight: bold; width: 100%; max-width: 250px; }
    button:hover { background: #d35400; }
    
    .btn-exit { background: #c0392b; margin-left: 8px; padding: 4px 10px; font-size: 12px; width: auto; }
    
    canvas { display: block; width: 100%; height: 100%; }
    
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .avatar-hud { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.75); padding: 4px 12px 4px 4px; border-radius: 30px; pointer-events: auto; }
    .avatar-hud .avatar-wrapper { width: 38px; height: 38px; border: 1px solid #f1c40f; }
    .stats { background: rgba(0,0,0,0.75); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #f1c40f; }
    
    #serve-btn { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 12px 35px; font-size: 18px; background: #27ae60; box-shadow: 0 4px #1e8449; width: auto; }
    
    .ranking-table { width: 100%; max-width: 350px; margin-top: 10px; border-collapse: collapse; }
    .ranking-table th, .ranking-table td { padding: 6px; text-align: center; border-bottom: 1px solid #444; font-size: 14px; }
    .ranking-table th { color: #f1c40f; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="menu-screen" class="screen">
      <h1>Vôlei de Areia<br>Saque no Alvo</h1>
      <h3>Escolha seu Jogador:</h3>
      <div class="player-select" id="player-container"></div>

      <div class="difficulty-select">
        <label for="difficulty">Dificuldade: </label>
        <select id="difficulty">
          <option value="easy">Fácil (Alvo Lento)</option>
          <option value="medium" selected>Médio (Alvo Normal)</option>
          <option value="hard">Difícil (Alvo Rápido)</option>
        </select>
      </div>

      <button onclick="startGame()">INICIAR JOGO</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1>Fim de Jogo!</h1>
      <p id="final-score" style="font-size: 20px; margin-bottom: 5px;">Pontuação: 0</p>
      <h3>Ranking Online</h3>
      <table class="ranking-table">
        <thead>
          <tr><th>#</th><th>Jogador</th><th>Pontos</th></tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button onclick="showMenu()" style="margin-top: 15px;">MENU PRINCIPAL</button>
    </div>

    <div id="hud" class="hidden">
      <div class="avatar-hud">
        <div class="avatar-wrapper">
          <img id="hud-avatar" src="" alt="Jogador">
        </div>
        <span id="hud-name">Jogador</span>
        <button class="btn-exit" onclick="quitGame()">Sair</button>
      </div>
      <div class="stats">
        <span>Pts: <span id="score">0</span></span> | 
        <span>Tent: <span id="attempts">5</span></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <button id="serve-btn" class="hidden" onclick="serveBall()">SACAR!</button>
  </div>

  <script>
    // Atualizado: nomes dos arquivos com sufixo _avatar.png
    const players = [
      { name: 'Ramon', avatar: 'ramon_avatar.png', stats: { forca: 9, precisao: 7, reflexo: 7, agilidade: 4 } },
      { name: 'Tato', avatar: 'tato_avatar.png', stats: { forca: 7, precisao: 9, reflexo: 6, agilidade: 6 } },
      { name: 'Ta', avatar: 'ta_avatar.png', stats: { forca: 6, precisao: 8, reflexo: 8, agilidade: 7 } },
      { name: 'Mi', avatar: 'mi_avatar.png', stats: { forca: 5, precisao: 9, reflexo: 9, agilidade: 8 } },
      { name: 'Manel', avatar: 'manel_avatar.png', stats: { forca: 8, precisao: 6, reflexo: 7, agilidade: 9 } },
      { name: 'Kami', avatar: 'kami_avatar.png', stats: { forca: 7, precisao: 8, reflexo: 9, agilidade: 6 } }
    ];

    let selectedPlayer = players[0];
    let score = 0;
    let attempts = 5;
    let isGaming = false;
    let isServing = false;
    let celebrationText = '';
    let celebrationTimer = 0;

    let target = { x: 100, y: 100, radius: 32, speed: 3, direction: 1 };
    let ball = { x: 400, y: 520, startX: 400, startY: 520, radius: 12, targetX: 0, targetY: 0, progress: 0, speed: 0.04 };

    let aimAngle = 0;
    let aimSpeed = 0.03;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function renderPlayerCards() {
      const container = document.getElementById('player-container');
      container.innerHTML = '';
      players.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `player-card ${index === 0 ? 'selected' : ''}`;
        card.onclick = () => selectPlayer(p, card);
        card.innerHTML = `
          <div class="avatar-wrapper">
            <img src="${p.avatar}" alt="${p.name}">
          </div>
          <p>${p.name}</p>
          <div class="stats-list">
            F:${p.stats.forca} P:${p.stats.precisao}<br>
            R:${p.stats.reflexo} A:${p.stats.agilidade}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectPlayer(player, cardElement) {
      selectedPlayer = player;
      document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
      cardElement.classList.add('selected');
    }

    function startGame() {
      const difficulty = document.getElementById('difficulty').value;
      if (difficulty === 'easy') target.speed = 2;
      if (difficulty === 'medium') target.speed = 4.5;
      if (difficulty === 'hard') target.speed = 7.5;

      score = 0;
      attempts = 5;
      isGaming = true;

      document.getElementById('hud-avatar').src = selectedPlayer.avatar;
      document.getElementById('hud-name').innerText = selectedPlayer.name;
      document.getElementById('score').innerText = score;
      document.getElementById('attempts').innerText = attempts;

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('serve-btn').classList.remove('hidden');

      resetBall();
      requestAnimationFrame(gameLoop);
    }

    function quitGame() {
      isGaming = false;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('serve-btn').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
    }

    function showMenu() {
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
    }

    function resetBall() {
      ball.x = 400;
      ball.y = 520;
      ball.progress = 0;
      isServing = false;
      document.getElementById('serve-btn').disabled = false;
    }

    function serveBall() {
      if (isServing || attempts <= 0) return;
      isServing = true;
      document.getElementById('serve-btn').disabled = true;

      const length = 450;
      ball.targetX = ball.startX + Math.sin(aimAngle) * length;
      ball.targetY = ball.startY - Math.cos(aimAngle) * length;
    }

    function gameLoop() {
      if (!isGaming) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      target.x += target.speed * target.direction;
      if (target.x + target.radius > canvas.width - 20 || target.x - target.radius < 20) {
        target.direction *= -1;
      }

      if (!isServing) {
        aimAngle += aimSpeed;
        if (aimAngle > 0.8 || aimAngle < -0.8) aimSpeed *= -1;
      }

      if (isServing) {
        ball.progress += ball.speed;
        ball.x = ball.startX + (ball.targetX - ball.startX) * ball.progress;
        ball.y = ball.startY + (ball.targetY - ball.startY) * ball.progress;

        if (ball.progress >= 1) checkHit();
      }

      if (celebrationTimer > 0) celebrationTimer--;
    }

    function checkHit() {
      const dist = Math.hypot(ball.x - target.x, ball.y - target.y);
      if (dist < target.radius + ball.radius) {
        score += 10;
        document.getElementById('score').innerText = score;
        celebrationText = "PONTO PERFEITO! 🎉";
        celebrationTimer = 180;
      }
      attempts--;
      document.getElementById('attempts').innerText = attempts;
      if (attempts <= 0) endGame();
      else resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let skyGradient = ctx.createLinearGradient(0, 0, 0, 250);
      skyGradient.addColorStop(0, '#1a5276');
      skyGradient.addColorStop(0.5, '#2980b9');
      skyGradient.addColorStop(1, '#f39c12');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, 250);
      ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(680, 70, 35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#117864'; ctx.fillRect(0, 240, canvas.width, 30);
      let sandGradient = ctx.createLinearGradient(0, 270, 0, 600);
      sandGradient.addColorStop(0, '#f5b041');
      sandGradient.addColorStop(1, '#d35400');
      ctx.fillStyle = sandGradient;
      ctx.fillRect(0, 270, canvas.width, 330);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(120, 320); ctx.lineTo(680, 320); ctx.lineTo(760, 580); ctx.lineTo(40, 580); ctx.closePath(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 260); ctx.lineTo(800, 260); ctx.stroke();
      ctx.save();
      ctx.translate(target.x, target.y);
      ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(0, 0, target.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, target.radius * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2980b9'; ctx.beginPath(); ctx.arc(0, 0, target.radius * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0, 0, target.radius * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (!isServing) {
        ctx.save();
        ctx.translate(ball.startX, ball.startY);
        ctx.rotate(aimAngle);
        ctx.strokeStyle = '#f1c40f'; ctx.fillStyle = '#f1c40f'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -80); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -80); ctx.lineTo(0, -100); ctx.lineTo(10, -80); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.ellipse(400, 570, 35, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d35400'; ctx.beginPath(); ctx.arc(400, 535, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.stroke();
      if (celebrationTimer > 0) {
        ctx.save();
        ctx.font = 'bold 42px Segoe UI';
        ctx.fillStyle = '#f1c40f';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.textAlign = 'center';
        ctx.strokeText(celebrationText, 400, 180);
        ctx.fillText(celebrationText, 400, 180);
        ctx.restore();
      }
    }

    function endGame() {
      isGaming = false;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('serve-btn').classList.add('hidden');
      document.getElementById('gameover-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = `Pontuação Final: ${score}`;
      updateOnlineRanking(selectedPlayer.name, score);
    }

    function updateOnlineRanking(playerName, playerScore) {
      let ranking = JSON.parse(localStorage.getItem('volei_ranking_v2')) || [];
      const existingIndex = ranking.findIndex(r => r.name === playerName);
      if (existingIndex !== -1) {
        if (playerScore > ranking[existingIndex].score) ranking[existingIndex].score = playerScore;
      } else {
        ranking.push({ name: playerName, score: playerScore });
      }
      ranking.sort((a, b) => b.score - a.score);
      ranking = ranking.slice(0, 5);
      localStorage.setItem('volei_ranking_v2', JSON.stringify(ranking));
      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '';
      ranking.forEach((rank, index) => {
        tbody.innerHTML += `<tr><td>${index + 1}º</td><td>${rank.name}</td><td>${rank.score} pts</td></tr>`;
      });
    }
    renderPlayerCards();
  </script>
</body>
</html>
