<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vôlei de Praia Pro</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; background: #0b132b; color: white;
      font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    }

    .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; background: #1c2541; z-index: 10; padding: 20px; }
    .hidden { display: none !important; }
    
    .badge { background: #48cae4; color: #0b132b; padding: 10px 20px; border-radius: 20px; font-weight: 800; margin-bottom: 15px; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 105px); gap: 15px; margin-bottom: 15px; }
    .card { background: #3a506b; border: 2px solid #5bc0be; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .card:active { transform: scale(0.95); }
    .card img { width: 80px; height: 100px; object-fit: contain; }
    .card span { display: block; margin-top: 6px; font-weight: bold; font-size: 0.9rem; }
    
    /* Ranking Styling */
    .ranking-box { background: #0b132b; border: 1px solid #5bc0be; border-radius: 10px; padding: 12px; width: 320px; margin-top: 10px; }
    .ranking-title { font-weight: bold; color: #48cae4; margin-bottom: 8px; text-align: center; text-transform: uppercase; font-size: 0.9rem; }
    .ranking-list { list-style: none; padding: 0; margin: 0; max-height: 100px; overflow-y: auto; font-size: 0.85rem; }
    .ranking-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1c2541; }

    select, button { background: #00b4d8; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    button:active { background: #90e0ef; color: #0b132b; }

    #game-container { display: flex; flex-direction: column; width: 100%; height: 100%; justify-content: space-between; position: relative; }
    canvas { width: 100%; height: 60vh; display: block; }
    
    #top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 5; }
    
    .controls { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1.2fr; gap: 8px; width: 100%; height: 40vh; background: #0b132b; padding: 12px; }
    .btn { background: #1c2541; border: 2px solid #3a506b; border-radius: 12px; color: white; font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .btn-action { background: #0077b6; border-color: #00b4d8; }
    .btn-jump { grid-column: span 4; background: #38b000; border-color: #70e000; font-size: 1.3rem; }
  </style>
</head>
<body>

  <!-- MENU INICIAL -->
  <div id="selection-screen" class="screen">
    <div class="badge" id="status">Jogador 1: Escolha seu Personagem</div>
    <div class="grid" id="grid"></div>
    
    <div style="margin-bottom: 10px; font-size: 0.9rem;">
      Dificuldade IA: 
      <select id="aiLevel">
        <option value="easy">Fácil</option>
        <option value="medium" selected>Médio</option>
        <option value="hard">Difícil</option>
      </select>
    </div>

    <!-- BOX DE RANKING -->
    <div class="ranking-box">
      <div class="ranking-title">🏆 Ranking de Vitórias</div>
      <ul class="ranking-list" id="ranking-ul"></ul>
    </div>
  </div>

  <!-- TELA DE FIM DE JOGO -->
  <div id="gameover-screen" class="screen hidden">
    <h1 id="winner-text" style="color:#48cae4; font-size: 2rem;">Jogador Venceu!</h1>
    <p id="final-score" style="font-size: 1.2rem; margin-bottom: 20px;">Placar: 12 x 10</p>
    <div style="display:flex; gap: 12px;">
      <button onclick="restartMatch()">Jogar Novamente</button>
      <button onclick="goToMenu()" style="background:#3a506b;">Menu Principal</button>
    </div>
  </div>

  <!-- CONTAINER DO JOGO -->
  <div id="game-container">
    <div id="top-bar">
      <button onclick="goToMenu()" style="padding: 6px 12px; font-size: 0.8rem; background:#3a506b;">Menu</button>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="controls">
      <div class="btn" id="btn-left">← ESQ</div>
      <div class="btn" id="btn-right">DIR →</div>
      <div class="btn btn-action" id="btn-bump">MANCHETE</div>
      <div class="btn btn-action" id="btn-spike">CORTE</div>
      <div class="btn btn-jump" id="btn-jump">PULAR / SACAR</div>
    </div>
  </div>

<script>
const characters = [
  { name: 'Ramon', file: 'ramon.png' },
  { name: 'Kami',  file: 'kami.png' },
  { name: 'Ta',    file: 'ta.png' },
  { name: 'Manel', file: 'manel.png' },
  { name: 'Mi',    file: 'mi.png' },
  { name: 'Tato',  file: 'tato.png' }
];

let p1Char, p2Char, step = 1, aiDifficulty = 'medium';
let s1 = 0, s2 = 0;
const MAX_POINTS = 12;

// Sistema de Ranking LocalStorage
function getRanking() {
  return JSON.parse(localStorage.getItem('volei_ranking') || '{}');
}

function saveWin(playerName) {
  const rank = getRanking();
  rank[playerName] = (rank[playerName] || 0) + 1;
  localStorage.setItem('volei_ranking', JSON.stringify(rank));
  renderRanking();
}

function renderRanking() {
  const rank = getRanking();
  const ul = document.getElementById('ranking-ul');
  ul.innerHTML = '';
  const sorted = Object.entries(rank).sort((a,b) => b[1] - a[1]);
  if(sorted.length === 0) {
    ul.innerHTML = '<li style="text-align:center; color:#888;">Nenhuma vitória salva</li>';
    return;
  }
  sorted.forEach(([name, wins]) => {
    ul.innerHTML += `<li class="ranking-item"><span>${name}</span> <b>${wins} vitórias</b></li>`;
  });
}
renderRanking();

const grid = document.getElementById('grid');
characters.forEach(char => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="${char.file}" alt="${char.name}"><span>${char.name}</span>`;
  card.onclick = () => {
    if (step === 1) {
      p1Char = char;
      step = 2;
      document.getElementById('status').innerText = "Escolha o Adversário (IA)";
    } else {
      p2Char = char;
      aiDifficulty = document.getElementById('aiLevel').value;
      document.getElementById('selection-screen').classList.add('hidden');
      document.getElementById('game-container').classList.remove('hidden');
      initGame();
    }
  };
  grid.appendChild(card);
});

function goToMenu() {
  step = 1; s1 = 0; s2 = 0;
  document.getElementById('status').innerText = "Jogador 1: Escolha seu Personagem";
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('selection-screen').classList.remove('hidden');
  renderRanking();
}

function initGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const imgP1 = new Image(); imgP1.src = p1Char.file;
  const imgP2 = new Image(); imgP2.src = p2Char.file;

  const input = { L: false, R: false, JUMP: false, BUMP: false, SPIKE: false };

  function bindTouch(id, key) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); input[key] = true; };
    const end = (e) => { e.preventDefault(); input[key] = false; };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
  }

  bindTouch('btn-left', 'L'); bindTouch('btn-right', 'R');
  bindTouch('btn-jump', 'JUMP'); bindTouch('btn-bump', 'BUMP'); bindTouch('btn-spike', 'SPIKE');

  const groundY = 320;
  let gameState = 'SERVING';
  let server = 'P1';

  // Personagens maiores: w: 80, h: 130
  const p1 = { x: 100, y: groundY - 130, w: 80, h: 130, vx: 0, vy: 0, ground: true, rot: 0, img: imgP1, name: p1Char.name };
  const p2 = { x: 620, y: groundY - 130, w: 80, h: 130, vx: 0, vy: 0, ground: true, rot: 0, img: imgP2, name: p2Char.name };
  const ball = { x: 150, y: 180, r: 14, vx: 0, vy: 0, angle: 0 };

  window.restartMatch = () => {
    s1 = 0; s2 = 0; server = 'P1'; gameState = 'SERVING';
    document.getElementById('gameover-screen').classList.add('hidden');
  };

  function updateAI() {
    let speed = aiDifficulty === 'easy' ? 3.2 : aiDifficulty === 'medium' ? 5.2 : 7.0;
    let targetX = 600;

    if (gameState === 'PLAYING' && ball.x > 320) {
      targetX = ball.x - p2.w / 2;
    }

    if (p2.x < targetX - 5) p2.vx = speed;
    else if (p2.x > targetX + 5) p2.vx = -speed;
    else p2.vx = 0;

    if (gameState === 'PLAYING' && ball.x > 420 && ball.y < 230 && p2.ground) {
      if (Math.abs((p2.x + p2.w / 2) - ball.x) < 50) {
        p2.vy = -12;
        p2.ground = false;
      }
    }

    if (gameState === 'SERVING' && server === 'P2') {
      setTimeout(() => {
        if (gameState === 'SERVING' && server === 'P2') {
          gameState = 'PLAYING';
          ball.vx = -5.8; ball.vy = -8;
        }
      }, 800);
    }
  }

  function loop() {
    p1.vx = input.L ? -6 : input.R ? 6 : 0;
    if (input.JUMP && p1.ground) {
      if (gameState === 'SERVING' && server === 'P1') {
        gameState = 'PLAYING'; ball.vx = 5.8; ball.vy = -8;
      } else {
        p1.vy = -12; p1.ground = false;
      }
    }

    p1.rot = input.SPIKE ? 0.3 : input.BUMP ? -0.2 : 0;
    p2.rot = (ball.x > 400 && ball.y < 200) ? -0.3 : 0;

    updateAI();

    [p1, p2].forEach((p, i) => {
      p.x += p.vx; p.vy += 0.52; p.y += p.vy;
      if (p.y >= groundY - p.h) { p.y = groundY - p.h; p.vy = 0; p.ground = true; }
      p.x = Math.max(i === 0 ? 10 : 410, Math.min(i === 0 ? 310 : 710, p.x));
    });

    if (gameState === 'SERVING') {
      ball.x = server === 'P1' ? p1.x + p1.w - 10 : p2.x + 10;
      ball.y = server === 'P1' ? p1.y + 20 : p2.y + 20;
    } else {
      ball.vy += 0.25; ball.x += ball.vx; ball.y += ball.vy;
      ball.angle += ball.vx * 0.05;

      if (ball.x <= ball.r || ball.x >= 800 - ball.r) ball.vx *= -0.8;

      if (ball.x + ball.r > 392 && ball.x - ball.r < 408 && ball.y + ball.r > 180) {
        ball.vx *= -0.8; ball.x = ball.x < 400 ? 392 - ball.r : 408 + ball.r;
      }

      if (ball.y >= groundY - ball.r) {
        if (ball.x < 400) { s2++; server = 'P2'; } else { s1++; server = 'P1'; }
        
        if ((s1 >= MAX_POINTS || s2 >= MAX_POINTS) && Math.abs(s1 - s2) >= 2) {
          let winner = s1 > s2 ? p1.name : p2.name;
          if (s1 > s2) saveWin(p1.name); // Salva vitória no ranking se P1 vencer
          document.getElementById('winner-text').innerText = `${winner} Venceu!`;
          document.getElementById('final-score').innerText = `Placar Final: ${s1} x ${s2}`;
          document.getElementById('gameover-screen').classList.remove('hidden');
        } else {
          gameState = 'SERVING';
        }
      }

      [p1, p2].forEach(p => {
        if (ball.x > p.x - 5 && ball.x < p.x + p.w + 5 && ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h) {
          let dir = p === p1 ? 1 : -1;
          if (input.SPIKE && p === p1) {
            ball.vy = 8.5; ball.vx = 7.5 * dir;
          } else if (input.BUMP && p === p1) {
            ball.vy = -11; ball.vx = 3.5 * dir;
          } else {
            ball.vy = -9.5; ball.vx = (4.5 + Math.random() * 2) * dir;
          }
        }
      });
    }

    // RENDERIZAÇÃO MELHORADA
    ctx.clearRect(0, 0, 800, 400);

    // Céu
    let skyGrad = ctx.createLinearGradient(0, 0, 0, 200);
    skyGrad.addColorStop(0, '#00b4d8'); skyGrad.addColorStop(1, '#90e0ef');
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, 800, 200);

    // Mar
    ctx.fillStyle = '#0077b6'; ctx.fillRect(0, 200, 800, 30);

    // Areia detalhada
    let sandGrad = ctx.createLinearGradient(0, 230, 0, 400);
    sandGrad.addColorStop(0, '#fde047'); sandGrad.addColorStop(1, '#ca8a04');
    ctx.fillStyle = sandGrad; ctx.fillRect(0, 230, 800, 170);

    // Sombras Dinâmicas
    [p1, p2, ball].forEach(obj => {
      let sw = obj.w ? obj.w : obj.r * 2;
      let factor = Math.max(0.2, 1 - (groundY - (obj.y + (obj.h || obj.r))) / 160);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(obj.x + (obj.w ? obj.w / 2 : 0), groundY + 3, (sw / 2) * factor, 6 * factor, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // Rede e Postes
    ctx.fillStyle = '#475569'; ctx.fillRect(393, 170, 4, 150); ctx.fillRect(403, 170, 4, 150);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(395, 180, 10, 140);
    ctx.fillStyle = '#dc2626'; ctx.fillRect(393, 180, 14, 8); // Borda

    // Jogadores com Imagens Maiores
    [p1, p2].forEach(p => {
      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      ctx.rotate(p.rot);
      if (p.img.complete) {
        ctx.drawImage(p.img, -p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    });

    // Bola Estilo Vôlei Tricolor
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.angle);
    ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI); ctx.fillStyle = '#0284c7'; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // Placar Digital
    ctx.fillStyle = 'rgba(11, 19, 43, 0.8)';
    ctx.fillRect(20, 15, 180, 35); ctx.fillRect(600, 15, 180, 35);
    ctx.fillStyle = '#48cae4'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`${p1.name}: ${s1}`, 30, 38);
    ctx.fillText(`${p2.name}: ${s2}`, 610, 38);

    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
