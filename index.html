<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vôlei de Praia - Super Cabeçudões</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: #1a1a24;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px 0;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffda79;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    /* Tela de Seleção */
    #selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #2c2c38;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid #444458;
    }

    .turn-indicator {
      font-size: 1.2rem;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #383848;
      color: #70a1ff;
      font-weight: bold;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 130px);
      gap: 15px;
    }

    .char-card {
      background: #383848;
      border: 3px solid #555568;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease-in-out;
    }

    .char-card:hover {
      transform: translateY(-5px);
      border-color: #ffda79;
      background: #444458;
    }

    .char-card img {
      width: 90px;
      height: 110px;
      object-fit: contain;
    }

    .char-card span {
      margin-top: 8px;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Tela do Jogo */
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      background: linear-gradient(to bottom, #70a1ff 65%, #f7b731 65%);
    }

    .controls-info {
      margin-top: 15px;
      display: flex;
      gap: 40px;
      background: #2c2c38;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 0.9rem;
    }

    .controls-info span {
      color: #ffda79;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Vôlei de Praia - Avatares</h1>

  <!-- TELA DE SELEÇÃO DE PERSONAGENS -->
  <div id="selection-screen">
    <div class="turn-indicator" id="turnIndicator">Jogador 1: Escolha seu Personagem</div>
    <div class="character-grid" id="characterGrid"></div>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="420"></canvas>
    <div class="controls-info">
      <div><span>P1:</span> A (Esquerda) | D (Direita) | W (Pulo)</div>
      <div><span>P2:</span> ← (Esquerda) | → (Direita) | ↑ (Pulo)</div>
    </div>
  </div>

<script>
// Lista de Personagens usando o NOME dos arquivos
const characters = [
  { id: 'ramon', name: 'Ramon', file: 'ramon.png' },
  { id: 'kami',  name: 'Kami',  file: 'kami.png' },
  { id: 'ta',    name: 'Ta',    file: 'ta.png' },
  { id: 'manel', name: 'Manel', file: 'manel.png' },
  { id: 'mi',    name: 'Mi',    file: 'mi.png' },
  { id: 'tato',  name: 'Tato',  file: 'tato.png' }
];

let player1Char = null;
let player2Char = null;
let currentSelectionStep = 1;

const gridEl = document.getElementById('characterGrid');
const indicatorEl = document.getElementById('turnIndicator');

characters.forEach(char => {
  const card = document.createElement('div');
  card.className = 'char-card';
  card.innerHTML = `
    <img src="${char.file}" alt="${char.name}">
    <span>${char.name}</span>
  `;
  card.onclick = () => selectCharacter(char);
  gridEl.appendChild(card);
});

function selectCharacter(char) {
  if (currentSelectionStep === 1) {
    player1Char = char;
    currentSelectionStep = 2;
    indicatorEl.innerText = "Jogador 2: Escolha seu Personagem";
    indicatorEl.style.color = "#ff7675";
  } else if (currentSelectionStep === 2) {
    player2Char = char;
    startMatch();
  }
}

function startMatch() {
  document.getElementById('selection-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  initGameEngine();
}

// --- ENGINE DO JOGO ---
function initGameEngine() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const imgP1 = new Image(); imgP1.src = player1Char.file;
  const imgP2 = new Image(); imgP2.src = player2Char.file;

  const gravity = 0.45;
  const groundY = 350;

  const net = { x: 395, y: 230, width: 10, height: 120 };

  let scoreP1 = 0;
  let scoreP2 = 0;

  const p1 = {
    x: 120, y: groundY - 80, width: 60, height: 80,
    vx: 0, vy: 0, speed: 6, jumpPower: -11, isGrounded: false,
    name: player1Char.name, img: imgP1
  };

  const p2 = {
    x: 620, y: groundY - 80, width: 60, height: 80,
    vx: 0, vy: 0, speed: 6, jumpPower: -11, isGrounded: false,
    name: player2Char.name, img: imgP2
  };

  const ball = {
    x: 200, y: 120, radius: 14,
    vx: 3, vy: 0,
    reset: function(servingP1) {
      this.x = servingP1 ? 200 : 600;
      this.y = 120;
      this.vx = servingP1 ? 3 : -3;
      this.vy = 0;
    }
  };

  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  function update() {
    // P1
    if (keys['a'] || keys['A']) p1.vx = -p1.speed;
    else if (keys['d'] || keys['D']) p1.vx = p1.speed;
    else p1.vx = 0;

    if ((keys['w'] || keys['W']) && p1.isGrounded) {
      p1.vy = p1.jumpPower;
      p1.isGrounded = false;
    }

    // P2
    if (keys['ArrowLeft']) p2.vx = -p2.speed;
    else if (keys['ArrowRight']) p2.vx = p2.speed;
    else p2.vx = 0;

    if (keys['ArrowUp'] && p2.isGrounded) {
      p2.vy = p2.jumpPower;
      p2.isGrounded = false;
    }

    // Atualizar Física Jogadores
    [p1, p2].forEach((p, idx) => {
      p.x += p.vx;
      p.vy += gravity;
      p.y += p.vy;

      if (p.y + p.height >= groundY) {
        p.y = groundY - p.height;
        p.vy = 0;
        p.isGrounded = true;
      }

      const minX = idx === 0 ? 0 : net.x + net.width;
      const maxX = idx === 0 ? net.x - p.width : canvas.width - p.width;
      p.x = Math.max(minX, Math.min(maxX, p.x));
    });

    // Física Bola
    ball.vy += gravity * 0.45;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Paredes
    if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
      ball.vx *= -0.85;
      ball.x = ball.x - ball.radius <= 0 ? ball.radius : canvas.width - ball.radius;
    }

    // Rede
    if (ball.x + ball.radius > net.x && ball.x - ball.radius < net.x + net.width && ball.y + ball.radius > net.y) {
      ball.vx *= -0.8;
      if (ball.x < net.x + net.width / 2) ball.x = net.x - ball.radius;
      else ball.x = net.x + net.width + ball.radius;
    }

    // Ponto
    if (ball.y + ball.radius >= groundY) {
      if (ball.x < net.x + net.width / 2) {
        scoreP2++;
        ball.reset(false);
      } else {
        scoreP1++;
        ball.reset(true);
      }
    }

    // Colisão Jogador-Bola
    [p1, p2].forEach(p => {
      const closestX = Math.max(p.x, Math.min(ball.x, p.x + p.width));
      const closestY = Math.max(p.y, Math.min(ball.y, p.y + p.height));
      const dx = ball.x - closestX;
      const dy = ball.y - closestY;

      if ((dx * dx + dy * dy) < ball.radius * ball.radius) {
        ball.vy = -9;
        const hitOffset = (ball.x - (p.x + p.width / 2)) / (p.width / 2);
        ball.vx = hitOffset * 5 + p.vx * 0.5;
      }
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Rede
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(net.x, net.y, net.width, net.height);
    ctx.fillStyle = '#f7b731';
    ctx.fillRect(net.x - 2, net.y, net.width + 4, 8);

    // Jogadores
    [p1, p2].forEach(p => {
      if (p.img.complete) {
        ctx.drawImage(p.img, p.x, p.y, p.width, p.height);
      } else {
        ctx.fillStyle = '#fff';
        ctx.fillRect(p.x, p.y, p.width, p.height);
      }
    });

    // Bola
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f7b731';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#26de81';
    ctx.stroke();

    // Placar
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 4;
    
    ctx.textAlign = 'left';
    ctx.fillText(`${p1.name}: ${scoreP1}`, 30, 40);

    ctx.textAlign = 'right';
    ctx.fillText(`${p2.name}: ${scoreP2}`, canvas.width - 30, 40);
    
    ctx.shadowBlur = 0;
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
}
</script>
</body>
</html>
