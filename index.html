<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vôlei de Areia - Saque no Alvo Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    body { 
      background: #0284c7; 
      color: #1e293b; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
    }
    
    #game-container { 
      position: relative; 
      width: 100%; 
      max-width: 800px; 
      height: 90vh; 
      max-height: 600px; 
      border-radius: 20px; 
      overflow: hidden; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
      background: url('./81609.jpg') no-repeat center center/cover;
      border: 3px solid #ffffff;
    }

    .screen { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(255, 255, 255, 0.45); 
      backdrop-filter: blur(8px);
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 10; 
      padding: 15px 20px; 
      overflow-y: auto;
    }

    .hidden { display: none !important; }
    
    h1 { 
      font-size: 26px; 
      color: #0369a1; 
      margin-bottom: 2px; 
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8); 
      text-align: center; 
      font-weight: 900; 
      letter-spacing: 1px; 
    }
    h3 { font-size: 14px; margin-bottom: 6px; color: #0f172a; font-weight: 700; }
    
    .player-select { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      width: 100%; 
      max-width: 480px; 
      max-height: 330px; 
      overflow-y: auto; 
      padding: 5px;
    }

    .player-card { 
      background: rgba(255, 255, 255, 0.82); 
      border: 3px solid rgba(255, 255, 255, 0.9); 
      border-radius: 16px; 
      padding: 10px; 
      cursor: pointer; 
      text-align: center; 
      transition: all 0.25s ease; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-card:hover, .player-card.selected { 
      border-color: #0284c7; 
      background: rgba(224, 242, 254, 0.98); 
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }
    
    /* CÍRCULO DOS JOGADORES AUMENTADO PARA 80px */
    .avatar-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto;
      background: #e2e8f0;
      border: 3px solid #0284c7;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    }

    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

    .player-card p { margin: 6px 0 3px 0; font-weight: 800; font-size: 14px; color: #0f172a; }
    .stats-list { font-size: 11px; text-align: center; background: rgba(2, 132, 199, 0.12); padding: 4px 8px; border-radius: 8px; color: #0369a1; font-weight: 700; width: 100%; }
    
    .difficulty-select { 
      margin: 5px 0; 
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    
    select { padding: 4px 10px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; cursor: pointer; outline: none; }
    
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      border-radius: 30px; 
      border: none; 
      cursor: pointer; 
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
      color: white; 
      font-weight: 800; 
      width: 100%; 
      max-width: 250px; 
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    button:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6); }
    
    .btn-exit { background: linear-gradient(135deg, #ef4444, #dc2626); margin-left: 8px; padding: 4px 12px; font-size: 11px; width: auto; border-radius: 15px; box-shadow: none; color: white; }
    
    canvas { display: block; width: 100%; height: 100%; }
    
    #hud { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      right: 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      pointer-events: none; 
      z-index: 5;
    }
    .avatar-hud { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      background: rgba(255, 255, 255, 0.85); 
      padding: 6px 16px 6px 6px; 
      border-radius: 40px; 
      pointer-events: auto; 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .avatar-hud .avatar-wrapper { width: 44px; height: 44px; border: 2px solid #0284c7; }
    .avatar-hud #hud-name { font-weight: 800; font-size: 14px; color: #0f172a; }
    
    .stats { 
      background: rgba(255, 255, 255, 0.85); 
      padding: 8px 18px; 
      border-radius: 30px; 
      font-size: 14px; 
      font-weight: 800; 
      color: #0f172a; 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    
    #serve-btn { 
      position: absolute; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      padding: 14px 45px; 
      font-size: 20px; 
      letter-spacing: 1px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); 
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5), 0 0 0 4px rgba(34, 197, 94, 0.2); 
      width: auto; 
      border-radius: 50px;
      animation: pulse 2s infinite;
    }
    #serve-btn:disabled { opacity: 0.5; animation: none; cursor: not-allowed; transform: translateX(-50%); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    
    .ranking-table { width: 100%; max-width: 420px; margin-top: 10px; border-collapse: collapse; }
    .ranking-table th, .ranking-table td { padding: 8px; text-align: center; border-bottom: 1px solid rgba(15, 23, 42, 0.1); font-size: 13px; vertical-align: middle; color: #0f172a; font-weight: 600; }
    .ranking-table th { color: #0369a1; font-weight: 800; }
    
    .ranking-player-cell { display: flex; align-items: center; gap: 10px; justify-content: flex-start; }
    .ranking-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #eee; border: 2px solid #0284c7; flex-shrink: 0; }
    .ranking-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="menu-screen" class="screen">
      <h1>VÔLEI DE AREIA<br><span style="font-size: 18px; color: #0284c7;">SAQUE NO ALVO</span></h1>
      <h3>Escolha seu Jogador:</h3>
      <div class="player-select" id="player-container"></div>

      <div class="difficulty-select">
        <label for="difficulty">Dificuldade:</label>
        <select id="difficulty">
          <option value="easy">Fácil</option>
          <option value="medium" selected>Médio</option>
          <option value="hard">Difícil</option>
        </select>
      </div>

      <button onclick="startGame()">INICIAR JOGO</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1>Fim de Jogo!</h1>
      <p id="final-score" style="font-size: 22px; margin-bottom: 5px; color: #0284c7; font-weight: 800;">Pontuação: 0</p>
      <h3>Ranking Online</h3>
      <table class="ranking-table">
        <thead>
          <tr><th>#</th><th style="text-align: left; padding-left: 10px;">Jogador</th><th>Pontos</th></tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button onclick="showMenu()" style="margin-top: 15px;">MENU PRINCIPAL</button>
    </div>

    <div id="hud" class="hidden">
      <div class="avatar-hud">
        <div class="avatar-wrapper">
          <img id="hud-avatar" src="" alt="Avatar">
        </div>
        <span id="hud-name">Jogador</span>
        <button class="btn-exit" onclick="quitGame()">Sair</button>
      </div>
      <div class="stats">
        <span>Pts: <span id="score" style="color: #0284c7;">0</span></span> &nbsp;|&nbsp; 
        <span>Tent: <span id="attempts" style="color: #ef4444;">5</span></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <button id="serve-btn" class="hidden" onclick="serveBall()">SACAR!</button>
  </div>

  <script>
    const players = [
      { name: 'Ramon', avatar: 'ramon_avatar.png', stats: { forca: 9, precisao: 7, reflexo: 7, agilidade: 4 } },
      { name: 'Tato', avatar: 'tato_avatar.png', stats: { forca: 7, precisao: 9, reflexo: 6, agilidade: 6 } },
      { name: 'Ta', avatar: 'ta_avatar.png', stats: { forca: 6, precisao: 8, reflexo: 8, agilidade: 7 } },
      { name: 'Mi', avatar: 'mi_avatar.png', stats: { forca: 5, precisao: 9, reflexo: 9, agilidade: 8 } },
      { name: 'Manel', avatar: 'manel_avatar.png', stats: { forca: 8, precisao: 6, reflexo: 7, agilidade: 9 } },
      { name: 'Kami', avatar: 'kami_avatar.png', stats: { forca: 7, precisao: 8, reflexo: 9, agilidade: 6 } }
    ];

    let selectedPlayer = players[0];
    let score = 0, attempts = 5, isGaming = false, isServing = false, celebrationText = '', celebrationTimer = 0;
    let target = { x: 100, y: 110, radius: 36, speed: 3, direction: 1 };
    let ball = { x: 400, y: 520, startX: 400, startY: 520, radius: 14, targetX: 0, targetY: 0, progress: 0, speed: 0.04 };
    let aimAngle = 0, aimSpeed = 0.03;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- GERADOR DE ÁUDIO (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playServeSound() {
      initAudio(); if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.2);
    }

    function playHitSound() {
      initAudio(); if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.08);
        gain.gain.setValueAtTime(0.5, now + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + index * 0.08); osc.stop(now + index * 0.08 + 0.3);
      });
    }

    function playMissSound() {
      initAudio(); if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.25);
    }

    function renderPlayerCards() {
      const container = document.getElementById('player-container');
      container.innerHTML = '';
      players.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `player-card ${index === 0 ? 'selected' : ''}`;
        card.onclick = () => { selectedPlayer = p; document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected')); card.classList.add('selected'); };
        card.innerHTML = `<div class="avatar-wrapper"><img src="${p.avatar}" alt="${p.name}"></div><p>${p.name}</p><div class="stats-list">F:${p.stats.forca} P:${p.stats.precisao} | R:${p.stats.reflexo} A:${p.stats.agilidade}</div>`;
        container.appendChild(card);
      });
    }

    function startGame() {
      const difficulty = document.getElementById('difficulty').value;
      target.speed = difficulty === 'easy' ? 2 : (difficulty === 'medium' ? 4.5 : 7.5);
      score = 0; attempts = 5; isGaming = true;
      document.getElementById('hud-avatar').src = selectedPlayer.avatar;
      document.getElementById('hud-name').innerText = selectedPlayer.name;
      document.getElementById('score').innerText = score;
      document.getElementById('attempts').innerText = attempts;
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('serve-btn').classList.remove('hidden');
      resetBall();
      requestAnimationFrame(gameLoop);
    }

    function quitGame() { isGaming = false; document.getElementById('hud').classList.add('hidden'); document.getElementById('serve-btn').classList.add('hidden'); document.getElementById('menu-screen').classList.remove('hidden'); }
    function showMenu() { document.getElementById('gameover-screen').classList.add('hidden'); document.getElementById('menu-screen').classList.remove('hidden'); }
    function resetBall() { ball.x = 400; ball.y = 520; ball.progress = 0; isServing = false; document.getElementById('serve-btn').disabled = false; }
    
    function serveBall() {
      if (isServing || attempts <= 0) return;
      playServeSound();
      isServing = true;
      document.getElementById('serve-btn').disabled = true;

      const targetY = target.y; 
      const deltaY = ball.startY - targetY;
      const deltaX = Math.tan(aimAngle) * deltaY;

      ball.targetX = ball.startX + deltaX;
      ball.targetY = targetY;
    }

    function gameLoop() {
      if (!isGaming) return;
      update(); draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (!isServing) { 
        aimAngle += aimSpeed; 
        if (aimAngle > 0.85 || aimAngle < -0.85) aimSpeed *= -1; 
      }

      target.x += target.speed * target.direction;
      if (target.x + target.radius > canvas.width - 20 || target.x - target.radius < 20) {
        target.direction *= -1;
      }

      if (isServing) {
        ball.progress += ball.speed;
        ball.x = ball.startX + (ball.targetX - ball.startX) * ball.progress;
        ball.y = ball.startY + (ball.targetY - ball.startY) * ball.progress;
        
        if (ball.progress >= 1) {
          checkHit();
          return;
        }
      }

      if (celebrationTimer > 0) celebrationTimer--;
    }

    function checkHit() {
      if (attempts <= 0) return; 

      const diffX = Math.abs(ball.x - target.x);
      const hitRadius = target.radius + ball.radius; 
      let isHit = false;

      if (diffX <= hitRadius) {
        score += 10;
        playHitSound();
        document.getElementById('score').innerText = score;
        celebrationText = "PONTO PERFEITO! 🎉";
        celebrationTimer = 150;
        isHit = true;
      }
      
      if (!isHit) playMissSound();
      attempts--;
      document.getElementById('attempts').innerText = attempts;

      if (attempts <= 0) {
        const delay = isHit ? 2200 : 800;
        setTimeout(() => endGame(), delay); 
      } else {
        resetBall();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // QUADRA ILUMINADA DE PRAIA
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 260);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, 260);

      let sandGrad = ctx.createLinearGradient(0, 260, 0, canvas.height);
      sandGrad.addColorStop(0, '#f59e0b');
      sandGrad.addColorStop(1, '#d97706');
      ctx.fillStyle = sandGrad; ctx.fillRect(0, 260, canvas.width, 340);

      // Linhas da Quadra
      ctx.strokeStyle = '#ffffff'; 
      ctx.lineWidth = 5; 
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 4;
      ctx.beginPath(); 
      ctx.moveTo(100, 310); ctx.lineTo(700, 310); ctx.lineTo(770, 580); ctx.lineTo(30, 580); 
      ctx.closePath(); 
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Rede
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(0, 250, canvas.width, 20);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 250); ctx.lineTo(canvas.width, 250); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(canvas.width, 270); ctx.stroke();

      // MIRA DE SAQUE COMPACTA
      if (!isServing) {
        const aimLength = 65; 
        const endX = ball.startX + Math.sin(aimAngle) * aimLength;
        const endY = ball.startY - Math.cos(aimAngle) * aimLength;

        ctx.save();
        let aimGrad = ctx.createLinearGradient(ball.startX, ball.startY, endX, endY);
        aimGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
        aimGrad.addColorStop(1, '#0284c7');

        ctx.strokeStyle = aimGrad;
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.moveTo(ball.startX, ball.startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.fillStyle = '#0284c7';
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(endX, endY, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ALVO ESTILIZADO
      ctx.save();
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 15;
      
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius * 0.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // BOLA DE VÔLEI
      ctx.save();
      const ballScale = 1 - (ball.progress * 0.3);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y + 15 * ballScale, ball.radius * ballScale, (ball.radius / 2) * ballScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#fbbf24'; 
      ctx.beginPath(); 
      ctx.arc(ball.x, ball.y, ball.radius * ballScale, 0, Math.PI * 2); 
      ctx.fill();
      
      ctx.strokeStyle = '#ffffff'; 
      ctx.lineWidth = 2; 
      ctx.stroke();
      ctx.restore();
      
      // CELEBRAÇÃO
      if (celebrationTimer > 0) {
        ctx.save();
        ctx.font = '900 36px Poppins, sans-serif'; 
        ctx.fillStyle = '#0284c7'; 
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.fillText(celebrationText, 400, 180);
        ctx.restore();
      }
    }

    function endGame() {
      isGaming = false;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('serve-btn').classList.add('hidden');
      document.getElementById('gameover-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = `Pontuação Final: ${score}`;
      updateOnlineRanking(selectedPlayer, score);
    }

    function updateOnlineRanking(player, playerScore) {
      let ranking = JSON.parse(localStorage.getItem('volei_ranking_v3')) || [];
      const existingIndex = ranking.findIndex(r => r.name === player.name);
      
      if (existingIndex !== -1) { 
        if (playerScore > ranking[existingIndex].score) {
          ranking[existingIndex].score = playerScore;
          ranking[existingIndex].avatar = player.avatar;
        }
      } else { 
        ranking.push({ name: player.name, avatar: player.avatar, score: playerScore }); 
      }

      ranking.sort((a, b) => b.score - a.score);
      ranking = ranking.slice(0, 5);
      localStorage.setItem('volei_ranking_v3', JSON.stringify(ranking));

      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '';
      ranking.forEach((rank, index) => { 
        const pInfo = players.find(p => p.name === rank.name);
        const avatarSrc = rank.avatar || (pInfo ? pInfo.avatar : 'ramon_avatar.png');

        tbody.innerHTML += `
          <tr>
            <td>${index + 1}º</td>
            <td>
              <div class="ranking-player-cell">
                <div class="ranking-avatar">
                  <img src="${avatarSrc}" alt="${rank.name}">
                </div>
                <span>${rank.name}</span>
              </div>
            </td>
            <td><strong style="color: #0284c7;">${rank.score}</strong> pts</td>
          </tr>`; 
      });
    }

    renderPlayerCards();
  </script>
</body>
</html>
