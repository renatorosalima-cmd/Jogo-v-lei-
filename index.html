<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vôlei de Areia - Saque no Alvo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #111; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-container { position: relative; width: 800px; height: 600px; background: linear-gradient(to bottom, #38ef7d, #11998e); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .hidden { display: none !important; }
    h1 { font-size: 32px; color: #f1c40f; margin-bottom: 20px; text-shadow: 2px 2px #000; }
    .player-select { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; max-width: 600px; }
    .player-card { background: #222; border: 3px solid transparent; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; transition: all 0.2s; width: 90px; }
    .player-card:hover, .player-card.selected { border-color: #f1c40f; transform: scale(1.05); }
    .player-card img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; background: #333; }
    .player-card p { margin-top: 5px; font-weight: bold; font-size: 14px; }
    .difficulty-select { margin-bottom: 20px; }
    select, button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; }
    button { background: #e67e22; color: white; font-weight: bold; }
    button:hover { background: #d35400; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .avatar-hud { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); padding: 5px 15px 5px 5px; border-radius: 30px; }
    .avatar-hud img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #f1c40f; object-fit: cover; }
    .stats { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; font-size: 18px; font-weight: bold; color: #f1c40f; }
    #serve-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px 40px; font-size: 20px; background: #27ae60; box-shadow: 0 4px #1e8449; }
    .ranking-table { width: 100%; max-width: 400px; margin-top: 15px; border-collapse: collapse; }
    .ranking-table th, .ranking-table td { padding: 8px; text-align: center; border-bottom: 1px solid #444; }
    .ranking-table th { color: #f1c40f; }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Menu -->
    <div id="menu-screen" class="screen">
      <h1>Vôlei de Areia: Saque no Alvo</h1>
      <h3>Escolha seu Jogador:</h3>
      <div class="player-select" id="player-container"></div>

      <div class="difficulty-select">
        <label for="difficulty">Dificuldade: </label>
        <select id="difficulty">
          <option value="easy">Fácil (Alvo Lento)</option>
          <option value="medium" selected>Médio (Alvo Normal)</option>
          <option value="hard">Difícil (Alvo Rápido)</option>
        </select>
      </div>

      <button onclick="startGame()">INICIAR JOGO</button>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="screen hidden">
      <h1>Fim de Jogo!</h1>
      <p id="final-score" style="font-size: 24px; margin-bottom: 10px;">Pontuação: 0</p>
      <h3>Ranking Online (Top 5)</h3>
      <table class="ranking-table">
        <thead>
          <tr><th>#</th><th>Jogador</th><th>Pontos</th></tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button onclick="showMenu()" style="margin-top: 20px;">JOGAR NOVAMENTE</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="avatar-hud">
        <img id="hud-avatar" src="" alt="Jogador">
        <span id="hud-name">Jogador</span>
      </div>
      <div class="stats">
        <span>Pontos: <span id="score">0</span></span> | 
        <span>Tentativas: <span id="attempts">5</span></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <button id="serve-btn" class="hidden" onclick="serveBall()">SACAR!</button>
  </div>

  <script>
    // Lista dos seus personagens
    const players = [
      { name: 'Ramon', avatar: 'ramon.png' },
      { name: 'Tato', avatar: 'tato.png' },
      { name: 'Ta', avatar: 'ta.png' },
      { name: 'Mi', avatar: 'mi.png' },
      { name: 'Manel', avatar: 'manel.png' },
      { name: 'Kami', avatar: 'kami.png' }
    ];

    let selectedPlayer = players[0];
    let score = 0;
    let attempts = 5;
    let isGaming = false;
    let isServing = false;

    let target = { x: 100, y: 100, radius: 30, speed: 3, direction: 1 };
    let ball = { x: 400, y: 520, startX: 400, startY: 520, radius: 12, targetX: 0, targetY: 0, progress: 0, speed: 0.03 };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Carregar cards dos jogadores na tela inicial
    function renderPlayerCards() {
      const container = document.getElementById('player-container');
      container.innerHTML = '';
      players.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `player-card ${index === 0 ? 'selected' : ''}`;
        card.onclick = () => selectPlayer(p, card);
        card.innerHTML = `<img src="${p.avatar}" alt="${p.name}"><p>${p.name}</p>`;
        container.appendChild(card);
      });
    }

    function selectPlayer(player, cardElement) {
      selectedPlayer = player;
      document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
      cardElement.classList.add('selected');
    }

    function startGame() {
      const difficulty = document.getElementById('difficulty').value;
      if (difficulty === 'easy') target.speed = 2;
      if (difficulty === 'medium') target.speed = 4.5;
      if (difficulty === 'hard') target.speed = 7.5;

      score = 0;
      attempts = 5;
      isGaming = true;

      document.getElementById('hud-avatar').src = selectedPlayer.avatar;
      document.getElementById('hud-name').innerText = selectedPlayer.name;
      document.getElementById('score').innerText = score;
      document.getElementById('attempts').innerText = attempts;

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('serve-btn').classList.remove('hidden');

      resetBall();
      requestAnimationFrame(gameLoop);
    }

    function showMenu() {
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
    }

    function resetBall() {
      ball.x = 400;
      ball.y = 520;
      ball.progress = 0;
      isServing = false;
      document.getElementById('serve-btn').disabled = false;
    }

    function serveBall() {
      if (isServing || attempts <= 0) return;
      isServing = true;
      document.getElementById('serve-btn').disabled = true;
      ball.targetX = target.x;
      ball.targetY = target.y;
    }

    function gameLoop() {
      if (!isGaming) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      target.x += target.speed * target.direction;
      if (target.x + target.radius > canvas.width - 20 || target.x - target.radius < 20) {
        target.direction *= -1;
      }

      if (isServing) {
        ball.progress += ball.speed;
        const currentX = ball.startX + (ball.targetX - ball.startX) * ball.progress;
        const currentY = ball.startY + (ball.targetY - ball.startY) * ball.progress;
        const arc = Math.sin(ball.progress * Math.PI) * 120;
        ball.x = currentX;
        ball.y = currentY - arc;

        if (ball.progress >= 1) checkHit();
      }
    }

    function checkHit() {
      const dist = Math.hypot(ball.x - target.x, ball.y - target.y);
      if (dist < target.radius + ball.radius) {
        score += 10;
        document.getElementById('score').innerText = score;
      }
      attempts--;
      document.getElementById('attempts').innerText = attempts;

      if (attempts <= 0) endGame();
      else resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Céu
      let skyGradient = ctx.createLinearGradient(0, 0, 0, 300);
      skyGradient.addColorStop(0, '#3498db');
      skyGradient.addColorStop(1, '#f39c12');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, 350);

      // Sol
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(700, 80, 40, 0, Math.PI * 2);
      ctx.fill();

      // Areia
      let sandGradient = ctx.createLinearGradient(0, 350, 0, 600);
      sandGradient.addColorStop(0, '#e67e22');
      sandGradient.addColorStop(1, '#f1c40f');
      ctx.fillStyle = sandGradient;
      ctx.fillRect(0, 350, canvas.width, 250);

      // Linhas da Quadra
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(100, 400); ctx.lineTo(700, 400);
      ctx.lineTo(750, 580); ctx.lineTo(50, 580);
      ctx.closePath(); ctx.stroke();

      // Rede
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(800, 300); ctx.stroke();

      // Alvo Móvel
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#e74c3c';
      ctx.beginPath(); ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(target.x, target.y, target.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath(); ctx.arc(target.x, target.y, target.radius * 0.3, 0, Math.PI * 2); ctx.fill();

      // Boneco (Costas)
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.ellipse(400, 570, 35, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d35400';
      ctx.beginPath(); ctx.arc(400, 535, 18, 0, Math.PI * 2); ctx.fill();

      // Bola
      ctx.fillStyle = '#f39c12';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.stroke();
    }

    function endGame() {
      isGaming = false;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('serve-btn').classList.add('hidden');
      document.getElementById('gameover-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = `Pontuação Final: ${score}`;
      updateOnlineRanking(selectedPlayer.name, score);
    }

    function updateOnlineRanking(playerName, playerScore) {
      let ranking = JSON.parse(localStorage.getItem('volei_ranking')) || [
        { name: 'Ramon', score: 40 },
        { name: 'Tato', score: 30 },
        { name: 'Kami', score: 20 }
      ];

      ranking.push({ name: playerName, score: playerScore });
      ranking.sort((a, b) => b.score - a.score);
      ranking = ranking.slice(0, 5);
      localStorage.setItem('volei_ranking', JSON.stringify(ranking));

      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '';
      ranking.forEach((rank, index) => {
        tbody.innerHTML += `<tr><td>${index + 1}º</td><td>${rank.name}</td><td>${rank.score} pts</td></tr>`;
      });
    }

    // Inicializa os cards ao carregar
    renderPlayerCards();
  </script>
</body>
</html>
