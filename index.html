<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vôlei de Praia Pro</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }

    /* Tela de Seleção */
    #selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: #1e293b;
    }
    .badge {
      background: #38bdf8;
      color: #0f172a;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }
    .card img { width: 65px; height: 80px; object-fit: contain; }
    .card span { display: block; margin-top: 4px; font-weight: bold; font-size: 0.85rem; }

    /* Opção de Dificuldade */
    .diff-select {
      margin-bottom: 15px;
      font-weight: bold;
    }
    select {
      background: #334155;
      color: white;
      border: 1px solid #38bdf8;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* Tela do Jogo */
    #game-container {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      justify-content: space-between;
    }
    canvas {
      width: 100%;
      height: 55vh;
      display: block;
      background: #38bdf8;
    }

    /* Controles */
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 1fr 1.2fr;
      gap: 8px;
      width: 100%;
      height: 45vh;
      background: #0f172a;
      padding: 10px;
      border-top: 3px solid #38bdf8;
    }
    .btn {
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 10px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active { background: #38bdf8; color: #0f172a; }
    .btn-action { background: #0284c7; border-color: #38bdf8; }
    .btn-jump { grid-column: span 4; background: #22c55e; border-color: #4ade80; font-size: 1.4rem; }
  </style>
</head>
<body>

  <!-- TELA DE SELEÇÃO -->
  <div id="selection-screen">
    <div class="badge" id="status">Jogador 1: Escolha seu Personagem</div>
    <div class="grid" id="grid"></div>
    
    <div class="diff-select">
      Dificuldade da IA: 
      <select id="aiLevel">
        <option value="0.03">Fácil</option>
        <option value="0.07" selected>Médio</option>
        <option value="0.13">Difícil</option>
      </select>
    </div>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="controls">
      <div class="btn" id="btn-left">← ESQ</div>
      <div class="btn" id="btn-right">DIR →</div>
      <div class="btn btn-action" id="btn-bump">MANCHETE</div>
      <div class="btn btn-action" id="btn-spike">CORTE</div>
      <div class="btn btn-jump" id="btn-jump">PULAR / SACAR</div>
    </div>
  </div>

<script>
const characters = [
  { name: 'Ramon', file: 'ramon.png' },
  { name: 'Kami',  file: 'kami.png' },
  { name: 'Ta',    file: 'ta.png' },
  { name: 'Manel', file: 'manel.png' },
  { name: 'Mi',    file: 'mi.png' },
  { name: 'Tato',  file: 'tato.png' }
];

let p1Char, p2Char, step = 1;
let aiSpeed = 0.07;

const grid = document.getElementById('grid');
characters.forEach(char => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="${char.file}" alt="${char.name}"><span>${char.name}</span>`;
  card.onclick = () => {
    if (step === 1) {
      p1Char = char;
      step = 2;
      document.getElementById('status').innerText = "Escolha o Adversário (IA)";
    } else {
      p2Char = char;
      aiSpeed = parseFloat(document.getElementById('aiLevel').value);
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      startGame();
    }
  };
  grid.appendChild(card);
});

function startGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const imgP1 = new Image(); imgP1.src = p1Char.file;
  const imgP2 = new Image(); imgP2.src = p2Char.file;

  const input = { L: false, R: false, JUMP: false, BUMP: false, SPIKE: false };

  function bindTouch(id, key) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
    el.addEventListener('mousedown', () => input[key] = true);
    el.addEventListener('mouseup', () => input[key] = false);
  }

  bindTouch('btn-left', 'L'); bindTouch('btn-right', 'R');
  bindTouch('btn-jump', 'JUMP'); bindTouch('btn-bump', 'BUMP'); bindTouch('btn-spike', 'SPIKE');

  const groundY = 330;
  let gameState = 'SERVING'; // SERVING, PLAYING
  let server = 'P1';

  const p1 = { x: 150, y: groundY - 70, w: 40, h: 70, vx: 0, vy: 0, ground: true, state: 'IDLE', img: imgP1, name: p1Char.name };
  const p2 = { x: 600, y: groundY - 70, w: 40, h: 70, vx: 0, vy: 0, ground: true, state: 'IDLE', img: imgP2, name: p2Char.name };
  const ball = { x: 150, y: 200, r: 12, vx: 0, vy: 0 };
  let s1 = 0, s2 = 0;

  function drawPlayer(p, isP2) {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h);

    // Corpo / Uniforme
    ctx.fillStyle = isP2 ? '#ef4444' : '#0284c7';
    ctx.fillRect(-12, -45, 24, 30); // Tronco

    // Pernas
    ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -15); ctx.lineTo(-8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(8, 0); ctx.stroke();

    // Braços e Animação Corporal
    ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 5;
    if (p.state === 'BUMP') { // Manchete
      ctx.beginPath();
      ctx.moveTo(0, -35);
      ctx.lineTo(isP2 ? -22 : 22, -25);
      ctx.stroke();
    } else if (p.state === 'SPIKE') { // Corte
      ctx.beginPath();
      ctx.moveTo(0, -35);
      ctx.lineTo(isP2 ? -15 : 15, -60);
      ctx.stroke();
    } else { // Postura Padrão
      ctx.beginPath();
      ctx.moveTo(0, -35);
      ctx.lineTo(isP2 ? -15 : 15, -20);
      ctx.stroke();
    }

    // Foto da Cabeça
    if (p.img.complete) {
      ctx.drawImage(p.img, -22, -80, 44, 44);
    }

    ctx.restore();
  }

  function loop() {
    // Definir Estado do Jogador
    p1.state = input.SPIKE ? 'SPIKE' : input.BUMP ? 'BUMP' : 'IDLE';

    // Movimento P1
    p1.vx = input.L ? -5 : input.R ? 5 : 0;
    if (input.JUMP && p1.ground) {
      if (gameState === 'SERVING' && server === 'P1') {
        gameState = 'PLAYING';
        ball.vx = 4.5;
        ball.vy = -7;
      } else {
        p1.vy = -11;
        p1.ground = false;
      }
    }

    // Movimento IA P2
    let targetX = (gameState === 'SERVING' && server === 'P2') ? 600 : ball.x;
    let dist = targetX - (p2.x + p2.w / 2);
    if (Math.abs(dist) > 15) p2.vx = Math.sign(dist) * (5 * (aiSpeed * 10));
    else p2.vx = 0;

    // Saque da IA
    if (gameState === 'SERVING' && server === 'P2') {
      setTimeout(() => {
        if (gameState === 'SERVING' && server === 'P2') {
          gameState = 'PLAYING';
          ball.vx = -4.5;
          ball.vy = -7;
        }
      }, 1000);
    }

    // Corte da IA se a bola estiver alta
    p2.state = (ball.x > 400 && ball.y < 220 && Math.abs(dist) < 30) ? 'SPIKE' : 'IDLE';
    if (ball.x > 500 && ball.y < 180 && p2.ground && gameState === 'PLAYING') {
      p2.vy = -11; p2.ground = false;
    }

    // Atualizar Posições e Física
    [p1, p2].forEach((p, i) => {
      p.x += p.vx; p.vy += 0.48; p.y += p.vy;
      if (p.y >= groundY - p.h) { p.y = groundY - p.h; p.vy = 0; p.ground = true; }
      p.x = Math.max(i === 0 ? 10 : 410, Math.min(i === 0 ? 340 : 750, p.x));
    });

    // Lógica da Bola
    if (gameState === 'SERVING') {
      ball.x = server === 'P1' ? p1.x + 30 : p2.x + 10;
      ball.y = server === 'P1' ? p1.y : p2.y;
      ball.vx = 0; ball.vy = 0;
    } else {
      ball.vy += 0.22; ball.x += ball.vx; ball.y += ball.vy;

      if (ball.x <= ball.r || ball.x >= 800 - ball.r) ball.vx *= -0.8;

      // Colisão Rede
      if (ball.x + ball.r > 392 && ball.x - ball.r < 408 && ball.y + ball.r > 210) {
        ball.vx *= -0.8;
        ball.x = ball.x < 400 ? 392 - ball.r : 408 + ball.r;
      }

      // Pontuação (Tocou no chão)
      if (ball.y >= groundY - ball.r) {
        if (ball.x < 400) { s2++; server = 'P2'; } 
        else { s1++; server = 'P1'; }
        gameState = 'SERVING';
      }

      // Interação Bola com Jogadores
      [p1, p2].forEach(p => {
        if (ball.x > p.x - 10 && ball.x < p.x + p.w + 10 && ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h) {
          if (p.state === 'SPIKE') {
            ball.vy = 7; // Cortada para baixo com força
            ball.vx = p === p1 ? 7 : -7;
          } else if (p.state === 'BUMP') {
            ball.vy = -10; // Manchete/Levantamento para o alto
            ball.vx = (ball.x - (p.x + p.w / 2)) * 0.2;
          } else {
            ball.vy = -7;
            ball.vx = (ball.x - (p.x + p.w / 2)) * 0.3;
          }
        }
      });
    }

    // --- DESENHO ---
    ctx.clearRect(0, 0, 800, 400);

    // Cenário e Quadra
    ctx.fillStyle = '#fde047'; ctx.fillRect(0, groundY, 800, 400 - groundY); // Areia
    ctx.fillStyle = '#0284c7'; ctx.fillRect(0, groundY - 10, 800, 10); // Linha
    ctx.fillStyle = '#ffffff'; ctx.fillRect(395, 210, 10, groundY - 210); // Rede

    // Jogadores
    drawPlayer(p1, false);
    drawPlayer(p2, true);

    // Bola de Vôlei
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15'; ctx.fill(); ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2; ctx.stroke();

    // Placar
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`${p1.name}: ${s1}`, 30, 40);
    ctx.fillText(`${p2.name}: ${s2}`, 650, 40);

    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
