<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vôlei de Praia</title>
  <style>
    body { 
      margin: 0; 
      background: #0b132b; 
      color: white; 
      font-family: sans-serif; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
    }
    canvas { 
      background: #87CEEB; 
      border: 5px solid #fff; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5); 
    }
    .screen { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      background: #1c2541; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 10; 
    }
    .hidden { display: none; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 110px); 
      gap: 15px; 
      margin-top: 20px; 
    }
    .card { 
      background: #3a506b; 
      padding: 10px; 
      border-radius: 10px; 
      text-align: center; 
      cursor: pointer; 
      transition: 0.2s; 
      font-weight: bold; 
      border: 2px solid transparent; 
    }
    .card:hover { 
      background: #5bc0be; 
      color: #0b132b; 
      border-color: #fff; 
    }
    .card img { 
      width: 80px; 
      height: 80px; 
      object-fit: contain; 
      display: block; 
      margin: 0 auto 5px auto; 
    }
    .btn-exit { 
      margin-top: 15px; 
      padding: 10px 20px; 
      background: #e63946; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      font-weight: bold; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

<!-- Tela de Seleção -->
<div id="selection-screen" class="screen">
  <h2 id="msg">Escolha seu Personagem</h2>
  <div id="grid" class="grid"></div>
</div>

<!-- Tela do Jogo -->
<div id="game-container" class="hidden">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div style="text-align: center;">
    <button class="btn-exit" onclick="location.reload()">Sair do Jogo</button>
  </div>
</div>

<script>
// Mapeamento dos personagens com base no padrão dos arquivos
const characters = [
  { name: 'Ramon', avatar: 'ramon_avatar.png', sheet: 'ramon_sheel.png', cols: 10, rows: 2 },
  { name: 'Tato',  avatar: 'tato_avatar.png',  sheet: 'tato_sheel.png',  cols: 10, rows: 2 },
  { name: 'Kami',  avatar: 'kami_avatar.png',  sheet: 'kami_sheel.png',  cols: 10, rows: 2 },
  { name: 'Manel', avatar: 'manel_avatar.png', sheet: 'manel_sheel.png', cols: 10, rows: 2 },
  { name: 'Mi',    avatar: 'mi_avatar.png',    sheet: 'mi_sheel.png',    cols: 10, rows: 2 },
  { name: 'Ta',    avatar: 'ta_avatar.png',    sheet: 'ta_sheel.png',    cols: 10, rows: 2 }
];

let p1Char, p2Char, step = 1;

// Gerar os cards na tela de seleção com os avatares
const grid = document.getElementById('grid');
characters.forEach(char => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="${char.avatar}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\'><rect width=\'100%\' height=\'100%\' fill=\'%23555\'/></svg>'"><span>${char.name}</span>`;
  
  card.onclick = () => {
    if (step === 1) { 
      p1Char = char; 
      step = 2; 
      document.getElementById('msg').innerText = "Escolha o Adversário"; 
    } else { 
      p2Char = char; 
      document.getElementById('selection-screen').classList.add('hidden'); 
      document.getElementById('game-container').classList.remove('hidden'); 
      initGame(); 
    }
  };
  grid.appendChild(card);
});

function initGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const imgP1 = new Image(); imgP1.src = p1Char.sheet;
  const imgP2 = new Image(); imgP2.src = p2Char.sheet;

  function drawFrame(img, charData, x, y, flip = false) {
    if (img.complete && img.naturalWidth > 0) {
      let frameW = img.naturalWidth / charData.cols;
      let frameH = img.naturalHeight / charData.rows;
      
      ctx.save();
      if (flip) {
        ctx.translate(x + 100, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, frameW, frameH, 0, 0, 100, 130);
      } else {
        ctx.drawImage(img, 0, 0, frameW, frameH, x, y, 100, 130);
      }
      ctx.restore();
    }
  }

  function loop() {
    ctx.clearRect(0, 0, 800, 400);
    
    // Fundo (Areia)
    ctx.fillStyle = '#fde047'; 
    ctx.fillRect(0, 220, 800, 180);
    
    // Rede
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath(); 
    ctx.moveTo(400, 150); 
    ctx.lineTo(400, 300); 
    ctx.stroke();

    // Jogadores (P1 na esquerda, P2 virado na direita)
    drawFrame(imgP1, p1Char, 150, 170, false);
    drawFrame(imgP2, p2Char, 550, 170, true);

    // Placar
    ctx.fillStyle = '#0b132b';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${p1Char.name}  0  x  0  ${p2Char.name}`, 400, 40);
    
    requestAnimationFrame(loop);
  }
  
  loop();
}
</script>
</body>
</html>
